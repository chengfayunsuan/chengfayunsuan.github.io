<!DOCTYPE html>
<html lang="zh-CN" class="auth-checking">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账户入口 · 乘法</title>
<meta name="description" content="登录或注册乘法账户。创建账户后可浏览公开问卷，参与市场调研并累积积分。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css?v=14">
<link rel="stylesheet" href="/css/auth.css?v=9">
</head>
<body class="auth-page">

<!-- ============ 导航 ============ -->
<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="/">
      <span class="brand__mark" aria-hidden="true"></span>
      乘法
      <span class="brand__en">CHENGFA</span>
    </a>
    <a class="auth-back" href="/">← 返回首页</a>
  </div>
</header>

<main class="auth">
  <div class="wrap auth__in">

    <!-- ---------- 表单 ---------- -->
    <section class="auth__panel">

      <span class="stamp stamp--red">ACCOUNT / 账户</span>

      <h1 class="auth__t" id="authTitle">登录</h1>
      <p class="auth__d" id="authDesc">使用注册时填写的邮箱与密码进入账户。</p>

      <div class="auth__tabs" role="tablist" aria-label="登录或注册">
        <button class="auth__tab is-on" type="button" role="tab" data-mode="login" aria-selected="true">登录</button>
        <button class="auth__tab" type="button" role="tab" data-mode="signup" aria-selected="false">注册</button>
      </div>

      <form class="auth__form" id="authForm" novalidate>

        <div class="field" id="userRow">
          <label class="field__l" for="username" id="userLabel">用户名</label>
          <input class="field__i" id="username" name="username" type="text"
                 autocomplete="username" placeholder="你的用户名"
                 spellcheck="false" maxlength="20" required>
          <p class="field__e" id="userErr" hidden></p>
          <p class="field__h" id="userHint">忘了用户名的话，填注册邮箱也能登。</p>
        </div>

        <div class="field" id="emailRow" hidden>
          <label class="field__l" for="email">邮箱</label>
          <input class="field__i" id="email" name="email" type="email"
                 autocomplete="email" placeholder="name@example.com"
                 spellcheck="false">
          <p class="field__e" id="emailErr" hidden></p>
          <p class="field__h">用于找回账号和接收通知，不会公开显示。</p>
        </div>

        <div class="field">
          <label class="field__l" for="password">密码</label>
          <input class="field__i" id="password" name="password" type="password"
                 autocomplete="current-password" placeholder="你的密码" required>
          <p class="field__e" id="pwErr" hidden></p>
          <p class="field__h" id="pwHint">忘了密码？到「联系客服」提交工单，注明注册邮箱，由站长核对后重置。</p>
        </div>

        <div class="field" id="agreeRow">
          <label class="check">
            <input type="checkbox" id="agree" name="agree">
            <span class="check__box" aria-hidden="true"></span>
            <span class="check__t">我已阅读并同意 <a class="check__a" href="/terms" target="_blank" rel="noopener">《用户协议》</a> 与 <a class="check__a" href="/privacy" target="_blank" rel="noopener">《隐私政策》</a>，了解积分规则与提现条件。</span>
          </label>
          <p class="field__e" id="agreeErr" hidden></p>
        </div>

        <button class="auth__verify" id="verifyBox" type="button" data-state="idle">
          <span class="auth__verify__mark" aria-hidden="true"></span>
          <span class="auth__verify__text" id="verifyText" role="status" aria-live="polite">点击完成人机验证</span>
          <span class="auth__verify__tag" id="verifyTag">VERIFY</span>
          <span class="cf-turnstile" id="tsSlot" aria-hidden="true"></span>
        </button>

        <button class="btn auth__submit" type="submit" id="authSubmit">
          登录 <span aria-hidden="true">→</span>
        </button>

        <p class="auth__note" id="authNote">
          登录状态保持 30 天。在公共设备上使用后请退出。
        </p>

      </form>
    </section>

    <!-- ---------- 右侧图形 ---------- -->
    <aside class="auth__art" aria-hidden="true">
      <div class="ac-tri">
        <div class="ac-tri__inner">
          <span class="ac-tri__num">180<span class="u">分</span></span>
          <span class="ac-tri__label">单份平均收益</span>
        </div>
      </div>
    </aside>

  </div>
</main>

<footer class="auth-foot">
  <div class="wrap auth-foot__in">
    <span>© 2026 乘法 CHENGFA</span>
    <span>参与调研 · 累计积分 · 兑换回报</span>
    <p class="foot__legal"><a href="/privacy">隐私政策</a> · <a href="/terms">用户协议</a> · <a href="/support">联系客服</a></p>
  </div>
</footer>

<script src="/js/config.js?v=7"></script>
<script src="/js/core.js?v=31"></script>
<script src="/js/auth.js?v=9" defer></script>

<!-- Turnstile：显式渲染 + 隐形模式，官方控件不占版面；本地换测试钥匙 -->
<script>
(function () {
  var dev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  window.CF_SITEKEY = dev ? '1x00000000000000000000AA' : '0x4AAAAAAGElp7Rel6PYL9UW';
})();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</body>
</html>
