<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户管理 · 乘法后台</title>
<meta name="description" content="乘法运营后台：用户管理。">
<meta name="theme-color" content="#1D52E2">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/style.css?v=8">
<link rel="stylesheet" href="/css/home.css?v=8">
<link rel="stylesheet" href="/css/page.css?v=5">
<link rel="stylesheet" href="/css/admin.css?v=6">
<script src="/js/config.js?v=4"></script>
<script src="/js/core.js?v=5"></script>
</head>
<body data-page="admin-users" data-accent="blue">

<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="/home">
      <span class="brand__mark" aria-hidden="true"></span>
      乘法
      <span class="brand__en">CHENGFA</span>
    </a>

    <div class="hm-nav">
      <span class="hm-nav__bal">
        <b id="navBal">0</b><i data-cur="code">CFB</i>
      </span>
      <span class="hm-nav__sep" aria-hidden="true"></span>
      <a class="hm-nav__name" id="navName" href="/home">我</a>
      <button class="hm-nav__exit" id="logoutBtn" type="button">退出</button>
    </div>
  </div>
</header>

<nav class="dock" aria-label="后台目录">
  <div class="wrap dock__in">
    <a class="dock__i" href="/admin">
      <span class="dock__n">01</span><span class="dock__t">后台概览</span>
    </a>
    <a class="dock__i is-on" href="/admin/users">
      <span class="dock__n">02</span><span class="dock__t">用户管理</span>
    </a>
    <a class="dock__i" href="/admin/withdrawals">
      <span class="dock__n">03</span><span class="dock__t">提现审核</span>
    </a>
    <a class="dock__i" href="/admin/tickets">
      <span class="dock__n">04</span><span class="dock__t">工单</span>
    </a>
    <button class="dock__i" type="button" data-soon="问卷管理">
      <span class="dock__n">04</span><span class="dock__t">问卷管理</span>
    </button>
    <button class="dock__i" type="button" data-soon="兑换码">
      <span class="dock__n">05</span><span class="dock__t">兑换码</span>
    </button>
    <button class="dock__i" type="button" data-soon="站内消息">
      <span class="dock__n">06</span><span class="dock__t">站内消息</span>
    </button>
  </div>
</nav>

<main id="app">

  <section class="face">
    <div class="wrap">
      <div class="face__in">
        <div class="face__id">
          <div class="face__meta">
            <span class="face__uid">ADMIN / 用户管理</span>
            <span class="adm-badge">账户</span>
          </div>
          <h1 class="face__name">用户管理</h1>
          <p class="face__sub">查找账户 · 调整法币 · 冻结封禁 · 修改角色</p>
          <div class="face__foot">
            <p class="adm-lead">点击任意一行展开操作。资金调整与状态变更都会写入流水，修改角色仅站长可用。</p>
          </div>
        </div>

        <div class="face__bal">
          <div class="face__bal-k">RESULTS / 查找结果</div>
          <div class="face__bal-n" id="usCount">0</div>
          <div class="face__bal-f">个账户</div>
          <div class="face__acts">
            <a class="btn btn--ghost" href="/admin">返回概览</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="adm-curbar">
    <div class="wrap adm-curbar__in">
      <span class="adm-curbar__k">CURRENCY / 金额显示</span>
      <div class="cur-seg">
        <button class="cur-seg__b" type="button" data-cur-mode="CNY">
          <b>CFB · 乘法币</b><i>按人民币显示</i>
        </button>
        <button class="cur-seg__b" type="button" data-cur-mode="USD">
          <b>CFD · 乘法刀</b><i>按美元显示</i>
        </button>
      </div>
      <span class="adm-curbar__hint">切换后下方法币金额按实时汇率换算</span>
    </div>
  </section>

  <section class="adm-sec adm-sec--last">
    <div class="wrap">
      <div class="adm-panel">
        <div class="adm-search">
          <input id="usQ" type="text" placeholder="UID / 用户名 / 邮箱" autocomplete="off">
          <button class="btn btn--red" id="usGo" type="button">查找</button>
          <span class="adm-search__hint">留空时列出最新注册的 20 个账户</span>
        </div>

        <div class="adm-list">
          <div class="adm-tr adm-tr--user adm-head">
            <span>UID</span><span>用户</span><span>角色</span><span>状态</span><span>法币</span><span>冻结</span>
          </div>
          <div id="usList"></div>
        </div>
        <p class="adm-empty" id="usEmpty" hidden>没有找到匹配的账户。</p>
      </div>
    </div>
  </section>

</main>

<div class="hm-toast" id="toast" role="status" aria-live="polite"></div>

<footer class="foot">
  <div class="wrap">
    <div class="foot__bar foot__bar--single">
      <span>© 2026 乘法 CHENGFA</span>
      <span>运营后台 · 仅限站长与管理员</span>
    </div>
  </div>
</footer>

<script src="/js/admin.js?v=6" defer></script>
</body>
</html>
