<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提现审核 · 乘法后台</title>
<meta name="description" content="乘法运营后台：提现审核。">
<meta name="theme-color" content="#1D52E2">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/style.css?v=6">
<link rel="stylesheet" href="/css/home.css?v=8">
<link rel="stylesheet" href="/css/page.css?v=5">
<link rel="stylesheet" href="/css/admin.css?v=3">
<script src="/js/config.js?v=2"></script>
<script src="/js/core.js?v=2"></script>
</head>
<body data-page="admin-withdrawals" data-accent="blue">

<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="/admin">
      <span class="brand__mark" aria-hidden="true"></span>
      乘法
      <span class="brand__en">CHENGFA</span>
    </a>

    <div class="hm-nav">
      <span class="hm-nav__bal">
        <b id="navBal">0</b><i data-cur="code">CFB</i>
      </span>
      <span class="hm-nav__sep" aria-hidden="true"></span>
      <a class="hm-nav__name" id="navName" href="/home">我</a>
      <button class="hm-nav__exit" id="logoutBtn" type="button">退出</button>
    </div>
  </div>
</header>

<nav class="dock" aria-label="后台目录">
  <div class="wrap dock__in">
    <a class="dock__i" href="/admin">
      <span class="dock__n">01</span><span class="dock__t">后台概览</span>
    </a>
    <a class="dock__i" href="/admin/users">
      <span class="dock__n">02</span><span class="dock__t">用户管理</span>
    </a>
    <a class="dock__i is-on" href="/admin/withdrawals">
      <span class="dock__n">03</span><span class="dock__t">提现审核</span>
    </a>
    <a class="dock__i" href="/admin/tickets">
      <span class="dock__n">04</span><span class="dock__t">工单</span>
    </a>
    <button class="dock__i" type="button" data-soon="问卷管理">
      <span class="dock__n">04</span><span class="dock__t">问卷管理</span>
    </button>
    <button class="dock__i" type="button" data-soon="兑换码">
      <span class="dock__n">05</span><span class="dock__t">兑换码</span>
    </button>
    <button class="dock__i" type="button" data-soon="站内消息">
      <span class="dock__n">06</span><span class="dock__t">站内消息</span>
    </button>
  </div>
</nav>

<main id="app">

  <section class="face">
    <div class="wrap">
      <div class="face__in">
        <div class="face__id">
          <div class="face__meta">
            <span class="face__uid">ADMIN / 提现审核</span>
            <span class="adm-badge">资金</span>
          </div>
          <h1 class="face__name">提现审核</h1>
          <p class="face__sub">通过打款 · 驳回退回 · 资金自动结算</p>
          <div class="face__foot">
            <p class="adm-lead">通过打款划走冻结额度，驳回退回可用余额。每笔处置都写入流水，可追溯。</p>
          </div>
        </div>

        <div class="face__bal">
          <div class="face__bal-k">PENDING / 待审笔数</div>
          <div class="face__bal-n" id="wdPending">—</div>
          <div class="face__bal-f">笔申请待处理</div>
          <div class="face__acts">
            <a class="btn btn--ghost" href="/admin">返回概览</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="adm-sec adm-sec--last">
    <div class="wrap">
      <div class="adm-panel">
        <div class="adm-tools">
          <div class="pg-tabs">
            <button class="pg-tab is-on" type="button" data-wd="pending">待审</button>
            <button class="pg-tab" type="button" data-wd="all">全部</button>
          </div>
          <span class="adm-tools__r">通过打款划走冻结；驳回退回可用余额</span>
        </div>

        <div class="adm-list">
          <div class="adm-tr adm-tr--wd adm-head">
            <span>单号</span><span>用户</span><span>金额</span><span>渠道 / 收款账号</span><span>申请时间</span><span>状态</span><span>操作</span>
          </div>
          <div id="wdList"></div>
        </div>
        <p class="adm-empty" id="wdEmpty" hidden>当前筛选下没有提现申请。</p>
      </div>
    </div>
  </section>

</main>

<div class="hm-toast" id="toast" role="status" aria-live="polite"></div>

<footer class="foot">
  <div class="wrap">
    <div class="foot__bar foot__bar--single">
      <span>© 2026 乘法 CHENGFA</span>
      <span>运营后台 · 仅限站长与管理员</span>
    </div>
  </div>
</footer>

<script src="/js/admin.js?v=3" defer></script>
</body>
</html>
