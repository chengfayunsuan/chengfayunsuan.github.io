<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提现审核 · 乘法后台</title>
<meta name="description" content="乘法运营后台：提现审核。">
<meta name="theme-color" content="#1D52E2">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/style.css?v=6">
<link rel="stylesheet" href="/css/home.css?v=8">
<link rel="stylesheet" href="/css/page.css?v=3">
<link rel="stylesheet" href="/css/admin.css?v=1">
<script src="/js/config.js?v=2"></script>
</head>
<body data-page="admin-withdrawals" data-accent="blue">

<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="/admin">
      <span class="brand__mark" aria-hidden="true"></span>
      乘法
      <span class="brand__en">CHENGFA</span>
    </a>

    <div class="hm-nav">
      <span class="hm-nav__bal">
        <b id="navBal">0</b><i data-cur="code">CFB</i>
      </span>
      <span class="hm-nav__sep" aria-hidden="true"></span>
      <a class="hm-nav__name" id="navName" href="/home">我</a>
      <button class="hm-nav__exit" id="logoutBtn" type="button">退出</button>
    </div>
  </div>
</header>

<div class="pg-bar">
  <div class="wrap pg-bar__in">
    <a class="pg-bar__a" href="/admin">← 返回后台首页</a>
    <span class="pg-bar__k">ADMIN / 提现审核</span>
  </div>
</div>

<main class="pg">
  <div class="wrap">

    <div class="pg-head">
      <div>
        <span class="pg-k">WITHDRAWALS</span>
        <h1 class="pg-t">提现审核</h1>
      </div>
      <div class="pg-side">
        <b id="wdPending">—</b>
        <span>笔待审</span>
      </div>
    </div>

    <div class="pg-tools">
      <div class="pg-tabs">
        <button class="pg-tab is-on" type="button" data-wd="pending">待审</button>
        <button class="pg-tab" type="button" data-wd="all">全部</button>
      </div>
      <span class="pg-tools__r">通过打款划走冻结；驳回退回可用余额</span>
    </div>

    <div class="adm-list">
      <div class="adm-tr adm-tr--wd adm-head">
        <span>单号</span><span>用户</span><span>金额</span><span>渠道 / 收款账号</span><span>申请时间</span><span>状态</span><span>操作</span>
      </div>
      <div id="wdList"></div>
    </div>
    <p class="adm-empty" id="wdEmpty" hidden>当前筛选下没有提现申请。</p>

  </div>
</main>

<div class="hm-toast" id="toast" role="status" aria-live="polite"></div>

<footer class="foot">
  <div class="wrap">
    <div class="foot__bar foot__bar--single">
      <span>© 2026 乘法 CHENGFA</span>
      <span>运营后台 · 仅限站长与管理员</span>
    </div>
  </div>
</footer>

<script src="/js/admin.js?v=1" defer></script>
</body>
</html>
