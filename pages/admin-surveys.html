<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问卷管理 · 乘法后台</title>
<meta name="description" content="乘法运营后台：问卷管理。">
<meta name="theme-color" content="#1D52E2">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/style.css?v=8">
<link rel="stylesheet" href="/css/home.css?v=8">
<link rel="stylesheet" href="/css/page.css?v=5">
<link rel="stylesheet" href="/css/admin.css?v=7">
<script src="/js/config.js?v=4"></script>
<script src="/js/core.js?v=7"></script>
</head>
<body data-page="admin-surveys" data-accent="blue">

<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="/home">
      <span class="brand__mark" aria-hidden="true"></span>
      乘法
      <span class="brand__en">CHENGFA</span>
    </a>

    <div class="hm-nav">
      <span class="hm-nav__bal">
        <b id="navBal">0</b><i data-cur="code">CFB</i>
      </span>
      <span class="hm-nav__sep" aria-hidden="true"></span>
      <a class="hm-nav__name" id="navName" href="/home">我</a>
      <button class="hm-nav__exit" id="logoutBtn" type="button">退出</button>
    </div>
  </div>
</header>

<nav class="dock" aria-label="后台目录">
  <div class="wrap dock__in">
    <a class="dock__i" href="/admin">
      <span class="dock__n">01</span><span class="dock__t">后台概览</span>
    </a>
    <a class="dock__i" href="/admin/users">
      <span class="dock__n">02</span><span class="dock__t">用户管理</span>
    </a>
    <a class="dock__i" href="/admin/withdrawals">
      <span class="dock__n">03</span><span class="dock__t">提现审核</span>
    </a>
    <a class="dock__i" href="/admin/tickets">
      <span class="dock__n">04</span><span class="dock__t">工单</span>
    </a>
    <a class="dock__i is-on" href="/admin/surveys">
      <span class="dock__n">05</span><span class="dock__t">问卷管理</span>
    </a>
    <button class="dock__i" type="button" data-soon="兑换码">
      <span class="dock__n">06</span><span class="dock__t">兑换码</span>
    </button>
    <button class="dock__i" type="button" data-soon="站内消息">
      <span class="dock__n">07</span><span class="dock__t">站内消息</span>
    </button>
  </div>
</nav>

<main id="app">

  <section class="face">
    <div class="wrap">
      <div class="face__in">
        <div class="face__id">
          <div class="face__meta">
            <span class="face__uid">ADMIN / 问卷管理</span>
            <span class="adm-badge">问卷</span>
          </div>
          <h1 class="face__name">问卷管理</h1>
          <p class="face__sub">录入问卷 · 定价 · 评级与星级 · 提拔到站长推荐</p>
          <div class="face__foot">
            <p class="adm-lead">价格以 CFB 计，保存后按整数分存储。状态为「开放」的问卷才会出现在大厅。</p>
          </div>
        </div>

        <div class="face__bal">
          <div class="face__bal-k">SURVEYS / 问卷总数</div>
          <div class="face__bal-n" id="svCount">0</div>
          <div class="face__bal-f">份 · <span id="svFeatCount">0</span> 份在推荐位</div>
          <div class="face__acts">
            <a class="btn btn--ghost" href="/hall">查看大厅</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="adm-sec">
    <div class="wrap">
      <div class="adm-panel">
        <div class="adm-h">
          <span class="adm-h__t" id="svFormTitle">新增问卷</span>
          <span class="adm-h__d">留空的字段不会在大厅显示</span>
        </div>

        <form class="svf" id="svForm" novalidate>
          <input type="hidden" id="svId" value="">

          <label class="svf__f svf__f--wide">
            <span class="svf__l">标题 <em>*</em></span>
            <input class="svf__i" id="svTitle" type="text" maxlength="80" placeholder="例如：城市通勤与消费习惯调研">
          </label>

          <label class="svf__f">
            <span class="svf__l">价格（CFB）</span>
            <input class="svf__i" id="svPrice" type="number" min="0" step="0.01" placeholder="12.50">
          </label>

          <label class="svf__f">
            <span class="svf__l">问卷商</span>
            <input class="svf__i" id="svProvider" type="text" maxlength="40" placeholder="例如：某某调研">
          </label>

          <label class="svf__f">
            <span class="svf__l">评级</span>
            <input class="svf__i" id="svGrade" type="text" maxlength="4" placeholder="S / A / B / C">
          </label>

          <label class="svf__f">
            <span class="svf__l">星级</span>
            <select class="svf__i" id="svStars">
              <option value="0">不显示</option>
              <option value="1">1 星</option>
              <option value="2">2 星</option>
              <option value="3">3 星</option>
              <option value="4">4 星</option>
              <option value="5">5 星</option>
            </select>
          </label>

          <label class="svf__f">
            <span class="svf__l">耗时（分钟）</span>
            <input class="svf__i" id="svDur" type="number" min="0" step="1" placeholder="6">
          </label>

          <label class="svf__f">
            <span class="svf__l">主题</span>
            <input class="svf__i" id="svTopic" type="text" maxlength="30" placeholder="例如：消费 / 出行">
          </label>

          <label class="svf__f">
            <span class="svf__l">状态</span>
            <select class="svf__i" id="svStatus">
              <option value="open">开放</option>
              <option value="paused">暂停</option>
              <option value="closed">关闭</option>
            </select>
          </label>

          <label class="svf__f svf__f--wide3">
            <span class="svf__l">入口链接</span>
            <input class="svf__i" id="svEntry" type="text" maxlength="300" placeholder="https://… 或 /问卷页；留空则大厅显示「暂未开放」">
          </label>

          <label class="svf__f svf__f--full">
            <span class="svf__l">参与要求</span>
            <textarea class="svf__i svf__i--area" id="svReq" rows="2" maxlength="200" placeholder="例如：18–35 岁 · 一二线城市 · 需实名认证"></textarea>
          </label>

          <div class="svf__acts">
            <button class="btn btn--red" type="submit" id="svSave">保存问卷</button>
            <button class="btn btn--ghost" type="button" id="svReset">清空</button>
            <span class="svf__msg" id="svMsg" role="status" aria-live="polite"></span>
          </div>
        </form>
      </div>
    </div>
  </section>

  <section class="adm-sec adm-sec--last">
    <div class="wrap">
      <div class="adm-panel">
        <div class="adm-h">
          <span class="adm-h__t">全部问卷</span>
          <span class="adm-h__d">「推荐」会把它提到大厅顶部的站长推荐位</span>
        </div>

        <div class="adm-list">
          <div class="adm-tr adm-tr--sv adm-head">
            <span>价格</span><span>标题</span><span>评级 / 星级</span><span>状态</span><span>推荐</span><span>操作</span>
          </div>
          <div id="svList"></div>
        </div>

        <p class="adm-empty" id="svEmpty" hidden>还没有问卷，用上面的表单加第一份。</p>
      </div>
    </div>
  </section>

</main>

<div class="hm-toast" id="toast" role="status" aria-live="polite"></div>

<footer class="foot">
  <div class="wrap">
    <div class="foot__bar foot__bar--single">
      <span>© 2026 乘法 CHENGFA</span>
      <span>运营后台 · 仅限站长与管理员</span>
    </div>
  </div>
</footer>

<script src="/js/admin-surveys.js?v=1" defer></script>
</body>
</html>
