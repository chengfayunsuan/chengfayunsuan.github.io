<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>答题 · 乘法</title>
<meta name="description" content="乘法 · 站内问卷答题">
<meta name="theme-color" content="#E0291E">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css?v=14">
<link rel="stylesheet" href="/css/home.css?v=16">
<link rel="stylesheet" href="/css/page.css?v=9">
<link rel="stylesheet" href="/css/survey.css?v=2">
<script src="/js/config.js?v=7"></script>
<script src="/js/core.js?v=31"></script>
</head>
<body data-page="survey">

<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="/hall">
      <span class="brand__mark" aria-hidden="true"></span>
      乘法
      <span class="brand__en">CHENGFA</span>
    </a>

    <div class="hm-nav">
      <span class="hm-nav__bal">
        <b id="navBal">0</b><button class="hm-nav__cur" type="button" data-cur-toggle aria-label="切换显示币种" title="点击在乘法币与乘法刀之间切换"><span data-cur="code">CFB</span></button>
      </span>
      <span class="hm-nav__sep" aria-hidden="true"></span>
      <a class="hm-nav__name" id="navName" href="/home">我</a>
    </div>
  </div>
</header>

<main id="app">
  <section class="paper-pg">
    <div class="wrap">

      <div class="paper-top">
        <a class="paper-back" href="/hall">← 回问卷大厅</a>
        <span class="paper-timer" id="svTimer">用时 0 秒</span>
      </div>

      <!-- 卷子信息 -->
      <div class="paper-card" id="svCard">
        <div class="paper-card__h">
          <span class="paper-card__k">SURVEY</span>
          <span class="paper-card__r" id="svReward">—</span>
        </div>
        <h1 class="paper-card__t" id="svTitle">正在载入问卷…</h1>
        <p class="paper-card__m" id="svMeta">—</p>
        <p class="paper-card__req" id="svReq" hidden></p>
      </div>

      <!-- 载入中 / 无法作答 -->
      <div class="paper-note" id="svNote" hidden></div>

      <!-- 答题 -->
      <form class="paper-form" id="svForm" hidden>
        <div id="svQs"></div>

        <div class="paper-submit">
          <span class="paper-progress" id="svProgress">0 / 0 题</span>
          <button class="btn btn--red" type="submit" id="svSend">提交答卷</button>
        </div>
        <p class="paper-tip" id="svTip"></p>
      </form>

      <!-- 结果 -->
      <div class="paper-result" id="svResult" hidden>
        <div class="paper-result__k" id="svResKind">RESULT</div>
        <h2 class="paper-result__t" id="svResTitle">—</h2>
        <p class="paper-result__d" id="svResDesc">—</p>
        <ul class="paper-steps" id="svSteps"></ul>
        <div class="paper-result__acts">
          <a class="btn btn--red" href="/hall">回问卷大厅</a>
          <a class="btn btn--ghost" href="/ledger">看收支明细</a>
        </div>
      </div>

    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <div class="foot__bar foot__bar--single">
      <span>© 2026 乘法 CHENGFA</span>
      <span>答卷只用于兑换积分</span>
    </div>
    <p class="foot__legal"><a href="/privacy">隐私政策</a> · <a href="/terms">用户协议</a> · <a href="/support">联系客服</a></p>
  </div>
</footer>

<div class="hm-toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/survey.js?v=2" defer></script>
</body>
</html>
